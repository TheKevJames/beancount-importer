name: ci

on:
  pull_request:
  push:
    branches: ['**']
    tags: ['[0-9]+.[0-9]+.[0-9]+']

jobs:
  lint:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          # renovate: datasource=github-releases depName=astral-sh/uv
          version: 0.12.16
          # renovate: datasource=docker depName=python
          python-version: 3.14.7
      - uses: j178/prek-action@v3.0.0
        with:
          # renovate: datasource=pypi depName=prek
          prek-version: v0.5.3
          extra-args: --all-files

  test:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --group dev
      - run: uv run pytest

  build:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          # renovate: datasource=github-releases depName=astral-sh/uv
          version: 0.12.16
          # renovate: datasource=docker depName=python
          python-version: 3.14.7
      - name: validate tag matches pyproject.toml
        run: |
          version="$(uv version --short)"
          if [ "${GITHUB_REF_NAME}" != "${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match pyproject version ${version}"
            exit 1
          fi
      - run: uv build
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [lint, test, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/beancount-importer
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist/
      - id: notes
        uses: orhun/git-cliff-action@v4.9.1
        with:
          config: cliff.toml
          args: --latest
      - uses: softprops/action-gh-release@v3.0.3
        with:
          body: ${{ steps.notes.outputs.content }}
          files: dist/*
