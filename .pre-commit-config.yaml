default_install_hook_types:
  - commit-msg
  - post-checkout
  - post-merge
  - post-rewrite
  - pre-commit

default_language_version:
  python: python3.14

repos:
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.6
    hooks:
      - id: remove-crlf
      - id: remove-tabs
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-toml
      - id: check-vcs-permalinks
      - id: check-xml
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace

# python
      - id: check-builtin-literals
      - id: check-docstring-first
      - id: name-tests-test
  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.80
    hooks:
      - id: ty
  - repo: local
    hooks:
      - id: pylint
        name: pylint
        entry: uv run --frozen pylint
        language: system
        types: [python]
        require_serial: true
        args:
          - --max-line-length=79
          - --max-module-lines=500
          - --max-positional-arguments=10
          - --max-args=10
          - --score=n
          - -d broad-except
          - -d duplicate-code
          - -d fixme
          - -d invalid-name
          - -d locally-disabled
          - -d missing-docstring
          - -d too-few-public-methods
          - -d try-except-raise
          - -d ungrouped-imports  # conflicts with ruff isort
          - -d wrong-import-order  # conflicts with ruff isort
      - id: flake8
        name: flake8
        entry: uv run --frozen flake8
        language: system
        types: [python]
        require_serial: true
        args:
          - --select=FCW,I90,IMR,N400
          - --ignore=IMR200
          - --per-file-ignores=tests/*:I900
          - --imr241_exclude=typing,collections.abc
      - id: disallow-untyped-imports
        name: disallow-untyped-imports
        entry: bash -c
        language: system
        pass_filenames: false
        require_serial: true
        types: [python]
        # Allowlist packages below which are known to have no third-party typestubs.
        args:
          - uvx mypy . --python-executable .venv/bin/python --follow-imports=skip --no-error-summary --no-color-output 2>&1 | grep -E '\[import-untyped\]' | grep -vE '"(beangulp|dateutil|openpyxl.*|titlecase|xlrd.*)"' | { ! grep .; }
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff-check
        args:
          - --fix
          - --target-version
          - py311
          - --select
          - A,ANN,C4,C901,D,E,F,G010,I,PYI,RUF006,RUF100,S307,T10,TRY,UP,W,YTT
          - --preview
          - --config
          - lint.mccabe.max-complexity = 10
          - --config
          - lint.external = ['FCW', 'I90', 'IMR', 'N400']
          - --config
          - lint.isort.force-single-line = true
          - --ignore
          - D1,D203,D205,D212,D400,D401,D404,D407,D412,D413,E501,E741,TRY003,TRY301
      - id: ruff-format
        args:
          - --config
          - line-length = 79
          - --config
          - format.quote-style = 'single'
          - --config
          - format.skip-magic-trailing-comma = true
          - --config
          - lint.isort.split-on-trailing-comma = false
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.13
    hooks:
      - id: uv-audit
      - id: uv-lock
      - id: uv-sync
  # TODO: use ruff once more refurb rules are out of preview
  - repo: https://github.com/dosisod/refurb
    rev: v2.3.1
    hooks:
      - id: refurb
        args:
          - --python-version
          - '3.11'
          - --
          - --scripts-are-modules
  - repo: https://github.com/henryiii/validate-pyproject-schema-store
    rev: 2026.09.08
    hooks:
      - id: validate-pyproject
  - repo: local
    hooks:
      - id: pyproject-no-unpinned-git-deps
        name: disallow git dependencies without rev/tag
        description: 'Disallow `[tool.uv.sources]` git dependencies unless they are pinned with a rev or tag on the same line'
        # Flags lines that contain `git = "..."` but do NOT also contain `rev =` or `tag =`.
        entry: '^(?!\s*#)(?=[^#]*\bgit\s*=\s*"[^"]+")(?![^#]*\b(?:rev|tag)\s*=).*$'
        language: pygrep
        types: [toml]
        files: 'pyproject\.toml$'
      - id: pyproject-no-unpinned-git-url-deps
        name: disallow unpinned PEP 508 git URLs
        description: 'Disallow `pkg @ git+<url>` direct references without an @<rev> pin'
        # A pinned direct reference ends the git+ URL with `@<rev>`. This does
        # not detect refs embedded in ssh URLs (`git+ssh://git@host/...`);
        # prefer https direct references so the pin is unambiguous.
        entry: '^(?!\s*#)(?=[^#]*git\+)(?![^#]*git\+[^\s"'',]+@[^\s"'',@/]+).*$'
        language: pygrep
        types: [toml]
        files: 'pyproject\.toml$'
      - id: pytest-fixtures-require-scope
        name: ensure pytest fixture scopes are explicitly set
        description: 'Ensure we explicitly set pytest fixture scopes'
        entry: '@pytest\.fixture( |\n|(\(\)))'
        language: pygrep
        types: [python]

# json
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.0
    hooks:
      - id: check-circle-ci
      - id: check-github-workflows
      - id: check-renovate
        language: python
        additional_dependencies:
          - pyjson5==2.0.1

# rst
  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: rst-backticks
      - id: rst-directive-colons
      - id: rst-inline-touching-normal
