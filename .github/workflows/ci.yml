name: CI

on:
  pull_request:
  push:
    branches:
      - master
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.1.0
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.14'
      - uses: j178/prek-action@v3.0.0
        with:
          prek-version: 0.5.2
          extra-args: --all-files

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v5.1.0
      - uses: snok/install-poetry@v1.4.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: poetry
      - run: poetry install --with dev
      - run: poetry run pytest

  build:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.1.0
      - uses: snok/install-poetry@v1.4.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.14'
      - name: validate tag matches pyproject.toml
        run: |
          version="$(poetry version -s)"
          if [ "${GITHUB_REF_NAME}" != "${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match pyproject version ${version}"
            exit 1
          fi
      - run: poetry build
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: dist
          path: dist/

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [lint, test, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/beancount-importer
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4.3.0
        with:
          name: dist
          path: dist/
      - id: notes
        uses: orhun/git-cliff-action@v4.9.0
        with:
          config: cliff.toml
          args: --latest
      - uses: softprops/action-gh-release@v3.0.3
        with:
          body: ${{ steps.notes.outputs.content }}
          files: dist/*
