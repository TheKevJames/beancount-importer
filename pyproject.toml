[project]
name = "beancount-importer"
version = "0.3.0"
description = "Various beancount importers"
requires-python = ">=3.11,<4.0"
license = { text = "MIT" }
readme = "README.rst"

authors = [
    { name = "Kevin James", email = "beancount-importer@thekev.in" },
]

dependencies = [
    "beancount>=3.0.0,<4.0.0",
    "beangulp>=0.2.0,<0.3.0",
    "click>=8.0.0,<9.0.0",
    "openpyxl>=3.0.0,<4.0.0",
    "pdfplumber>=0.11.10,<0.12.0",
    "python-dateutil>=2.0.0,<3.0.0",
    "sh>=2.0.0,<3.0.0",
    "titlecase>=2.0.0,<3.0.0",
    "xlrd>=2.0.0,<3.0.0",
]

[project.urls]
repository = "https://github.com/TheKevJames/beancount-importer"

[project.scripts]
bean-import = "beancount_importer.cli:run"

[dependency-groups]
dev = [
    "flake8-broken-line==1.0.0",
    "flake8-complicated-walrus==2.1.0",
    "flake8-import-restrictions==2.1",
    "flake8-requirements==2.3.0",
    "flake8==7.3.0",
    "pylint==4.0.8",
    "pytest==9.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["beancount_importer"]

[tool.ty.rules]
dynamic-function-decorator-return = "error"
missing-type-argument = "error"
possibly-unresolved-reference = "warn"
unsound-return-statement = "error"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
